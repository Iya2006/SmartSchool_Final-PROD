<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Variante maskable : fond plein sans coins arrondis (l'OS applique son
       propre masque), glyphe reduit pour rester dans la zone de securite
       centrale (~80% de diametre). -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="52%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="512" height="512" fill="url(#bg)"/>
  <g transform="translate(166 166) scale(7.5)" fill="#ffffff">
    <rect x="3" y="13" width="4.5" height="7" rx="1.6"/>
    <rect x="9.75" y="8.5" width="4.5" height="11.5" rx="1.6"/>
    <rect x="16.5" y="4" width="4.5" height="16" rx="1.6"/>
  </g>
</svg>
